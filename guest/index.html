          "

      </div>

      <div
        style="display: flex; align-items: center; gap: 10px; margin-top: 10px"

        <span id="fileStatus" style="font-size: 13px; color: #666"></span>
      </div>

      <audio

    <script type="module">
      console.log("module load!", new Date());
      let facingMode = "environment";

      // For this example, we're importing from the local build
      import { OmiGuestSDK } from "./omisdk.es.js";
      const autoConnected = localStorage.getItem("autoConnected");
      window.addEventListener("load", (ev) => {
        console.log("document on load!", new Date());
        const urlParams = new URLSearchParams(window.location.search);
        const appId = urlParams.get("appId");
        console.log("appId", appId);
        document.getElementById("appIdInput").value = appId;

        const guest = new OmiGuestSDK({
          baseUrl: "https://crm-dev-v2.metechvn.com",
          apiKey: "0c16d4aa-abe7-4098-b47a-7b914f9b7444",
          appId: appId,
          mediaIds: {
            localVideoID: "local",
            remoteVideoID: "video1",
            remoteAudioID: "audio1",
            remoteScreenID: "mpt-body",
          },
          enableMediapipe: true,
          model: "medium",
        });
        function randomPhone10Starting0() {
          let s = "0";
          for (let i = 1; i < 10; i++) {
            s += Math.floor(Math.random() * 10);
          }
          return s;
        }

        document.getElementById("make").addEventListener("click", () => {
          // guest
          guest
            .makeCall(randomPhone10Starting0(), {
              enableVideo: true,
              extraInfo: "guest call demo",
              requestDelegate: {
                onAccept: (sessionId, record) => {
                  console.log("onAccept", sessionId, record);
                },
                onHangup: (sessionId, record) => {
                  console.log("onHangup", sessionId, record);
                },
                onConnection: () => {
                  console.log("onConnection");
                },
                onConnectedSuccessfully: (sessionId) => {
                  console.log("onConnectedSuccessfully", sessionId);
                },
                onTranscript: (sessionId, data, type) => {
                  console.log("onTranscript", sessionId, data, type);
                },
                onCaptureSnapshot: (sessionId, status) => {
                  console.log("onCaptureSnapshot", sessionId, status);
                },
              },
            })
            .then((res) => {
              console.log("make call success", res);
            });
        });
        // document.getElementById("updateCall").addEventListener("click", () => {
        //   // guest
        //   guest.switchVideoCall();
        // });

        document.getElementById("mute").addEventListener("click", () => {
          console.log("mute clicked");
          guest.mute().then((res) => {
            console.log("mute success", res);
          });
        });
        document
          .getElementById("appIdInput")
          .addEventListener("change", (e) => {
            // Nếu muốn set trực tiếp vào sdk thì có thể:
            guest.AppId = e.target.value;
          });
        document.getElementById("un mute").addEventListener("click", () => {
          console.log("unmute clicked");
          guest.unmute().then((res) => {
            console.log("unmute success", res);
          });
        });
        document.getElementById("hangup").addEventListener("click", () => {
          guest.hangup();
        });
        document.getElementById("cameraOn").addEventListener("click", () => {
          guest.cameraOn();
        });
        document.getElementById("cameraOff").addEventListener("click", () => {
          guest.cameraOff();
        });
        document
          .getElementById("resolutionSelect")
          .addEventListener("change", (e) => {
            const value = e.target.value;
            if (!value) return;
            const [w, h] = value.split("x").map(Number);
            console.log("w", w);
            console.log("h", h);
            try {
              guest.videoResolution(w, h);
              console.log("Set resolution:", w, h);
            } catch (err) {
              console.log("Set resolution error:", err);
            }
          });
        document
          .getElementById("resetRegistration")
          .addEventListener("click", () => {
            guest.resetRegistration();
          });
        guest.on("GuestEvent", (event) => {
          console.log("CallEvent received:", event, new Date().getTime());
        });
        document
          .getElementById("switchCamera")
          .addEventListener("click", () => {
            guest
              .switchCamera(facingMode)
              .then((res) => {
                console.log("switchCamera success", res);
                facingMode = facingMode === "user" ? "environment" : "user";
              })
              .catch((err) => {
                console.log("switchCamera error", err);
              });
          });
        document
          .getElementById("blurBackground")
          .addEventListener("click", () => {
            guest.blurBackground(true);
          });
        document
          .getElementById("unblurBackground")
          .addEventListener("click", () => {
            guest.blurBackground(false);
          });
        let changeTextInterval = null;
        const changeTextBtn = document.getElementById("changeText");
        changeTextBtn.addEventListener("click", () => {
          if (changeTextInterval) {
            clearInterval(changeTextInterval);
            changeTextInterval = null;
            changeTextBtn.style.backgroundColor = "#4caf50";
            changeTextBtn.textContent = "Change Text";
            return;
          }
          changeTextBtn.style.backgroundColor = "#f44336";
          changeTextBtn.textContent = "Stop Text";
          changeTextInterval = setInterval(() => {
            const now = new Date();
            const pad = (n) => String(n).padStart(2, "0");
            const timeString = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`;
            // Không truyền position → vị trí giữ nguyên, chỉ thay đổi text
            guest.setOverlayText(0, timeString);
          }, 1000);
        });

        document.getElementById("sendMessage").addEventListener("click", () => {
          const input = document.getElementById("messageInput");
          const message = input.value.trim();
          if (!message) return;
          console.log("Send message:", message);
          guest.sendMessage(message);
          input.value = "";
        });

        document
          .getElementById("messageInput")
          .addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              document.getElementById("sendMessage").click();
            }
          });

        document.getElementById("sendFile").addEventListener("click", () => {
          const fileInput = document.getElementById("fileInput");
          const status = document.getElementById("fileStatus");
          if (!fileInput.files || fileInput.files.length === 0) {
            status.textContent = "Chưa chọn file";
            return;
          }
          const files = fileInput.files;
          const attachments = [];
          let processed = 0;
          guest.upLoadFile(files);
          Array.from(files).forEach((file, i) => {
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onloadend = () => {
              if (reader.result instanceof ArrayBuffer) {
                const base64 = guest.arrayBufferToBase64(
                  reader.result,
                  file.type,
                );
                attachments.push({
                  id: "23423",
                  url: base64,
                  type: file.type,
                  fileName: file.name,
                  size: file.size,
                });
                processed++;
                if (processed === files.length) {
                  console.log("Send attachments:", attachments);
                  guest.sendAttachments(attachments);
                  status.textContent = `Đã gửi ${attachments.length} file`;
                  fileInput.value = "";
                }
              }
            };
          });
        });

        document
          .getElementById("video1")
          .addEventListener("loadedmetadata", (event) => {
            const video = document.getElementById("video1");
            video?.srcObject?.getVideoTracks().forEach((track) => {
              console.log("track", track);
              track.enabled = true;
            });
          });

        guest.on("InteractionGuestEvent", (event) => {
          console.log("InteractionGuestEvent received:", event);
          const text = event?.message?.text || "";
          const from = event?.message?.sendFrom || "Agent";
          const sendFrom = event?.message?.sendFrom || "unknown";
          if (text) {
            const isCustomer = sendFrom === "CUSTOMER";
            const msgEl = document.createElement("div");
            msgEl.style.cssText = `padding:8px 12px;margin:4px 0;border-radius:12px;font-size:13px;max-width:75%;word-break:break-word;${
              isCustomer
                ? "align-self:flex-end;background:#4CAF50;color:#fff;margin-left:auto;border-bottom-right-radius:4px"
                : "align-self:flex-start;background:#e8e8e8;color:#333;margin-right:auto;border-bottom-left-radius:4px"
            }`;
            msgEl.innerHTML = `<div style="font-size:10px;font-weight:700;opacity:0.7;margin-bottom:2px">${from}</div>${text}`;
            document.getElementById("messageInput").parentElement.before(msgEl);
          }
        });

        // Set up UI controls
      });

      // Example of making a call after 3 seconds
      setTimeout(() => {}, 3000);
    </script>
  </body>
